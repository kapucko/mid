# Základné nastavenia webu
title: MID Solutions
lang: sk

# Adresa webu. Ak budete mať vlastnú doménu, napíšte ju sem, napr. "https://www.midsolutions.sk"
url: ""

# Ak web beží na adrese typu https://meno.github.io/mid, nastavte baseurl: "/mid"
# Pri vlastnej doméne alebo repozitári meno.github.io nechajte prázdne.
baseurl: "/mid"

# Súbory, ktoré sa na web nemajú dostať
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.docx"
  - vendor
  - node_modules
