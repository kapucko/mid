# - Pri dlhších textoch (riadok končí znakom |) píšte text odsadený o medzery pod ním.
#   Prázdny riadok = nový odsek. **slovo** = tučné písmo.
# - Ak text obsahuje dvojbodku, dajte ho celý do úvodzoviek "...".

